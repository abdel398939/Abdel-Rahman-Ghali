<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdelrahman Ghali | Digital Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08111f;--card:#101b2d;--line:#22314d;--pri:#4f7cff;--text:#eef4ff;--muted:#9fb0cf}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Cairo,Inter,sans-serif;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit}
.container{width:min(1100px,92%);margin:auto}

/* NAV */
.nav{
position:fixed;
top:0;
width:100%;
z-index:1000;
background:rgba(8,17,31,.75);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,.06);
transition:.3s;
}
.nav.scrolled{
box-shadow:0 10px 30px rgba(0,0,0,.45);
background:rgba(8,17,31,.95);
}
.nav-inner{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font-weight:800;font-size:1.2rem}
.logo span{color:var(--pri)}
.menu{display:flex;gap:18px;align-items:center}
.menu a{color:var(--muted);position:relative;padding:6px 0;transition:.3s}
.menu a:hover{color:#fff}
.menu a.active{color:#fff}
.menu a.active::after,
.menu a::after{
content:'';
position:absolute;
bottom:0;left:0;
height:2px;
width:0;
background:var(--pri);
transition:.3s;
}
.menu a.active::after{width:100%}
.menu a:hover::after{width:100%}

.btn{background:var(--pri);padding:10px 18px;border-radius:10px;font-weight:700}
.btn-outline{border:1px solid var(--line);background:transparent}

section{padding:90px 0}
.hero{text-align:center;padding-top:120px}
.hero h1{font-size:3rem;margin:15px 0}
.hero p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--card);padding:20px;border-radius:16px;border:1px solid rgba(255,255,255,.05)}
.title{text-align:center;font-size:2rem;margin-bottom:10px}
.sub{text-align:center;color:var(--muted);margin-bottom:40px}

@media(max-width:800px){.grid{grid-template-columns:1fr}.menu{display:none}}
</style>
</head>
<body>

<nav class="nav" id="nav">
<div class="container nav-inner">
<a href="#home" class="logo">AG<span>.</span></a>
<div class="menu">
<a href="#home" class="nav-link active" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
<a href="#services" class="nav-link" data-ar="الخدمات" data-en="Services">الخدمات</a>
<a href="#projects" class="nav-link" data-ar="المشاريع" data-en="Projects">المشاريع</a>
<a href="#testimonials" class="nav-link" data-ar="الشهادات" data-en="Testimonials">الشهادات</a>
<a href="#contact" class="nav-link" data-ar="تواصل" data-en="Contact">تواصل</a>
<a href="#" id="lang">EN</a>
</div>
</div>
</nav>

<section class="hero" id="home">
<div class="container">
<h1 data-ar="نبني حضورًا رقميًا للشركات" data-en="We build digital presence for companies">نبني حضورًا رقميًا للشركات</h1>
<p data-ar="مواقع وأنظمة وهوية مؤسسية" data-en="Websites, systems, and corporate identity">مواقع وأنظمة وهوية مؤسسية</p>
<a class="btn" data-ar="عرض الأعمال" data-en="View Work">عرض الأعمال</a>
</div>
</section>

<section id="services">
<div class="container">
<h2 class="title" data-ar="الخدمات" data-en="Services">الخدمات</h2>
<div class="grid">
<div class="card">Web Development</div>
<div class="card">MIS Systems</div>
<div class="card">Brand Identity</div>
</div>
</div>
</section>

<section id="projects">
<div class="container">
<h2 class="title" data-ar="المشاريع" data-en="Projects">المشاريع</h2>
<div class="grid">
<div class="card">HR System</div>
<div class="card">E-Commerce</div>
<div class="card">Corporate Site</div>
</div>
</div>
</section>

<section id="testimonials">
<div class="container">
<h2 class="title" data-ar="الشهادات" data-en="Testimonials">الشهادات</h2>
<div class="grid">
<div class="card">"Professional work"</div>
<div class="card">"High quality"</div>
<div class="card">"Fast delivery"</div>
</div>
</div>
</section>

<section id="contact">
<div class="container" style="text-align:center">
<h2 class="title" data-ar="تواصل معي" data-en="Contact Me">تواصل معي</h2>
<a class="btn">WhatsApp</a>
</div>
</section>

<script>
const nav=document.getElementById("nav");
window.addEventListener("scroll",()=>{
nav.classList.toggle("scrolled",window.scrollY>50);
});

const links=document.querySelectorAll(".nav-link");
const sections=document.querySelectorAll("section");
window.addEventListener("scroll",()=>{
let current="";
sections.forEach(sec=>{
const top=sec.offsetTop-120;
if(window.scrollY>=top) current=sec.id;
});
links.forEach(l=>{
l.classList.remove("active");
if(l.getAttribute("href")==="#"+current) l.classList.add("active");
});
});

let lang="ar";
const btn=document.getElementById("lang");
btn.addEventListener("click",e=>{
e.preventDefault();
lang=lang==="ar"?"en":"ar";
document.documentElement.lang=lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
btn.textContent=lang==="ar"?"EN":"AR";
document.querySelectorAll("[data-ar]").forEach(el=>{
el.textContent=el.getAttribute("data-"+lang);
});
});
</script>

</body>
</html>
